name: Nightly (floating dependencies)

# The CI gate (ci.yml) tests uv.lock's versions; this run takes the newest versions pyproject.toml allows, so a new
# release of a dependency that breaks basal shows here before uv.lock moves to it.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

# The schedule runs in the public repository only (a private one pays for its minutes; a fork does not need it), and
# macOS there only. A scheduled run has no event payload, so github.event.repository.private is not known: the
# repository's name decides. workflow_dispatch runs the Linux job anywhere.
jobs:
  test-linux:
    if: ${{ github.event_name == 'workflow_dispatch' || github.repository == 'rkinas/basal' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv
      - run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install -e ".[test]"
      - run: uv run --no-sync pytest -q -n 2 --dist loadfile

  test-macos:
    if: ${{ github.repository == 'rkinas/basal' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          python-version: "3.13"
      - run: uv venv
      - run: uv pip install -e ".[test]"
      - run: uv run --no-sync pytest -q -n 2 --dist loadfile

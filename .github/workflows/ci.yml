name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# one run per pull request (or branch): a new push cancels the run it supersedes
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      # the same Ruff as .pre-commit-config.yaml, with the pyproject.toml rules, over the whole repository
      - uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6  # v3.6.1
        with:
          version: "0.15.16"
          src: .

  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          python-version: ${{ matrix.python }}
      # the gate runs uv.lock's versions (floating ones run nightly: nightly.yml), with the CPU build of uv.lock's torch:
      # on Linux uv.lock pulls ~86 nvidia CUDA wheels (several GB) that no CPU test needs
      - run: uv venv
      - run: uv export --frozen --extra test --no-emit-project --no-hashes -o locked.txt
      - run: uv pip install "$(grep -E '^torch==' locked.txt | cut -d' ' -f1)" --index-url https://download.pytorch.org/whl/cpu
      - run: grep -v -E '^(nvidia-|cuda-|triton==|torch==)' locked.txt > deps.txt && uv pip install -r deps.txt
      - run: uv pip install --no-deps -e .
      - run: uv run --no-sync pytest -q -n 2 --dist loadfile  # whole files per worker: module fixtures load once

  test-macos:
    # the public repository only: a private repository pays for its minutes, and macOS ones count 10 times
    if: ${{ !github.event.repository.private }}
    runs-on: macos-latest  # Apple Silicon: also runs the MLX tests
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          python-version: "3.13"
      - run: uv sync --frozen --extra test
      - run: uv run --no-sync pytest -q -n 2 --dist loadfile  # whole files per worker: module fixtures load once

  test-typescript:  # clients/typescript against basal-serve on the stub engine (its README, "Tests")
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"  # npm test passes a glob to node --test (Node 21+); the package itself needs 18.17
      # the gate runs uv.lock's versions (floating ones run nightly: nightly.yml), with the CPU build of uv.lock's torch:
      # on Linux uv.lock pulls ~86 nvidia CUDA wheels (several GB) that no CPU test needs
      - run: uv venv
      - run: uv export --frozen --extra test --no-emit-project --no-hashes -o locked.txt
      - run: uv pip install "$(grep -E '^torch==' locked.txt | cut -d' ' -f1)" --index-url https://download.pytorch.org/whl/cpu
      - run: grep -v -E '^(nvidia-|cuda-|triton==|torch==)' locked.txt > deps.txt && uv pip install -r deps.txt
      - run: uv pip install --no-deps -e .
      - run: npm ci --ignore-scripts
        working-directory: clients/typescript
      - run: npm test
        working-directory: clients/typescript
        env:
          BASAL_PYTHON: ${{ github.workspace }}/.venv/bin/python

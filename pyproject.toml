[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "basal"
version = "2.4.1"
description = "Inference engine for basal: fast, calibrated typed decisions (choice / yes-no / score) for Polish and English"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.11",
  "transformers==5.17.0",
  "huggingface_hub>=0.34",
  "accelerate>=1.10",
  "safetensors>=0.6",
  "starlette>=0.47",
  "uvicorn[standard]>=0.35",
  "httpx>=0.28",
]

[project.optional-dependencies]
ui = ["fastapi>=0.115"]
fp8 = ["torchao==0.18.0"]
nvfp4 = ["torchao==0.18.0"]
vllm = ["vllm>=0.11"]
mlx = [  # Apple Silicon: --mode mlx / mlx-q8 (-MLX-8bit / -MLX-fp4 exports or bf16 weights); mlx-lm needs Python 3.11+
  "mlx>=0.32; sys_platform == 'darwin' and platform_machine == 'arm64' and python_version >= '3.11'",
  "mlx-lm>=0.32; sys_platform == 'darwin' and platform_machine == 'arm64' and python_version >= '3.11'",
]
media = ["pillow", "soundfile", "scipy", "torchvision"]  # --media on (basal-omni): images and audio; Gemma 4 image processing needs torchvision (the build of the installed torch)
gguf = ["llama-cpp-python>=0.3.36"]  # --mode gguf: a GGUF file in process (Metal, CUDA or CPU); 0.3.36: Gemma 4 (basal-omni) checked
gguf-export = ["gguf>=0.19"]  # basal-export-gguf: GGUF with the Hugging Face tokenization (docs/GGUF.md)
mcp = ["mcp>=2.3,<3"]  # basal-serve --mcp on (MCP at /mcp) and the basal-mcp stdio bridge, for agents
# --mode tpu (experimental, Google TPU VMs; docs/HARDWARE.md, "Google TPU"): JAX with libtpu (both from PyPI), pinned to
# the version the backend was validated with
tpu = ["jax[tpu]==0.11.1; python_version >= '3.12' and sys_platform == 'linux'"]
test = [
  "pytest", "jsonschema", "mcp>=2.3,<3", "fastapi>=0.115",
  "mlx>=0.32; sys_platform == 'darwin' and platform_machine == 'arm64' and python_version >= '3.11'",
  "mlx-lm>=0.32; sys_platform == 'darwin' and platform_machine == 'arm64' and python_version >= '3.11'",
]
# the release gate of basal-ui with the models on disk (tests/e2e, BASAL_E2E=1; docs/E2E.md): its page tests drive
# Chromium (after installing: playwright install chromium)
e2e = ["playwright>=1.48"]

[project.scripts]
basal-ui = "basal.ui.app:main"
basal-serve = "basal.server:main"
basal-bench = "basal.bench:main"
basal-loadtest = "basal.loadtest:main"
basal-run = "basal.run:main"
basal-export-gguf = "basal.gguf_export:main"
basal-mcp = "basal.mcp_server:main"
basal-calibrate = "basal.calibrate:main"
basal-viz = "basal.viz:main"

[tool.setuptools]
packages = ["basal", "basal.ui"]

[tool.setuptools.package-data]
basal = ["examples/*.jsonl", "examples/*.py", "viz.html"]
"basal.ui" = ["static/*.html", "static/fonts/*"]

[tool.pytest.ini_options]
pythonpath = ["."]  # tests import shared stubs from tests.test_server
markers = ["e2e: end-to-end test of a real basal-ui with real models (BASAL_E2E=1; docs/E2E.md)"]

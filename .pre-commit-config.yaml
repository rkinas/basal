repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-toml
      - id: check-yaml
      - id: check-json

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        types_or: [python, pyi]
        args: [--select, 'E9,F63,F7,F82', --target-version, py310, --no-fix, --no-cache]

  - repo: local
    hooks:
      - id: check-jsonl
        name: check JSONL syntax
        entry: python scripts/check_jsonl.py
        language: python
        files: '\.jsonl$'

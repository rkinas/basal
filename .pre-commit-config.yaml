repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-toml
      - id: check-yaml
      - id: check-json

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16  # the Ruff of CI (.github/workflows/ci.yml), with the rules of pyproject.toml
    hooks:
      - id: ruff-check
        types_or: [python, pyi, jupyter]
        args: [--no-fix, --no-cache]

  - repo: local
    hooks:
      - id: check-jsonl
        name: check JSONL syntax
        entry: python scripts/check_jsonl.py
        language: python
        files: '\.jsonl$'
